# Example parameter file for the COLA density field (dens_type = 4).
#
# COLA evolves particles with a particle-mesh force solver in the frame that
# comoves with their 2LPT trajectory, so large scales stay exact while a handful
# of timesteps recovers the non-linear small scales. See Tassev, Zaldarriaga &
# Eisenstein 2013 (JCAP 06:036) and Howlett & Manera 2015 (L-PICOLA).
#
# Two settings are not optional for COLA and CoLoRe will refuse to run without
# them:
#   * r_smooth must be negative. The Gaussian pre-smoothing of the initial field
#     permanently removes exactly the small-scale power the PM steps exist to
#     evolve, so with smoothing on COLA would simply reproduce 2LPT.
#   * lpt_vels must be 1 (CoLoRe forces it). Otherwise the density would be
#     non-linear while the redshift-space distortions stayed linear-theory.

global:
{
  prefix_out= "examples/cola/out";
  output_format= "FITS";
  output_density= true
  pk_filename= "examples/simple/Pk_CAMB_test.dat"
  z_min= 0.001
  z_max= 0.450
  seed= 1003
  write_pred=false
  pred_dz=0.1
  just_write_pred= false
}

field_par:
{
  #COLA needs an unsmoothed initial field
  r_smooth= -1
  smooth_potential= false
  n_grid= 256

  #Density field type
  # 0-lognormal
  # 1-1LPT
  # 2-2LPT
  # 4-COLA
  dens_type= 4

  lpt_buffer_fraction= 0.6
  #COLA only supports CIC
  lpt_interp_type= 1
  #Forced to 1 for COLA
  lpt_vels= 1
  #Not supported for COLA (particles cross the lightcone incrementally)
  output_lpt= 0

  #--- COLA options (all optional; the values shown are the defaults) ---

  #Number of kick-drift-kick timesteps. The lightcone shell sweeps a lot of
  #cells per step at low redshift, so 20-30 is a better default than the 10
  #quoted for snapshot COLA. Setting this to 0 skips the time loop entirely,
  #which is useful for testing (see cola_lightcone_mode).
  cola_n_steps= 20

  #Redshift at which the 2LPT initial conditions are laid down and the
  #integration starts. Must be >= z_max, otherwise the outermost shell of the
  #lightcone would have no COLA history.
  cola_z_init= 9.0

  #Exponent of Tassev's modified time variable. 0 uses the standard kick/drift
  #factors, which are unambiguous; -2.5 is L-PICOLA's default and can reduce the
  #number of steps needed, but should be justified by a convergence test.
  cola_nlpt= 0.0

  #Timestep spacing: 0 = uniform in a, 1 = uniform in log(a)
  cola_step_dist= 0

  #1 = deposit each particle when it crosses its own lightcone radius (the
  #physical choice; needs cola_n_steps >= 1). 0 = no time loop at all: deposit
  #at the Lagrangian radius with analytic growth factors, which reproduces the
  #2LPT path bit-for-bit and exists only as a self-test (needs cola_n_steps = 0).
  cola_lightcone_mode= 1

  #Remove the residual mean PM force. The k=0 mode is zero analytically, but the
  #CIC round trip leaves a small remainder which would integrate into a global
  #velocity offset, i.e. a spurious all-sky RSD dipole.
  cola_subtract_mean= 1

  #Divide the CIC assignment window out of the Poisson solve
  cola_deconvolve_cic= 1

  #Include the 2nd-order displacement in the COLA frame. Setting this to 0
  #drops to a 1LPT frame, which needs more timesteps for the same accuracy.
  cola_use_2lpt= 1

  #Force-mesh refinement factor. Only 1 is implemented; use a larger n_grid.
  cola_force_grid_factor= 1

  #Set to 1 to override the r_smooth guard. Not recommended.
  cola_allow_smoothing= 0
}

cosmo_par:
{
  omega_M= 0.3
  omega_L= 0.7
  omega_B= 0.05
  h= 0.7
  w= -1.0
  ns= 0.96
  sigma_8= 0.803869
}

srcs1:
{
  nz_filename= "examples/simple/Nz_test.txt"
  bias_filename= "examples/simple/Bz_test.txt"
  include_lensing= false
  store_skewers= false
}
